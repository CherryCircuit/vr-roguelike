<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPACEOMICIDE Biome Review</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #08050d;
      color: #f7f0ff;
      font-family: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      padding: 18px;
    }
    .panel {
      pointer-events: auto;
      max-width: 340px;
      padding: 14px 16px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(9, 8, 18, 0.68);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.28);
    }
    #left-panel {
      align-self: flex-start;
    }
    #right-panel {
      align-self: flex-start;
      min-width: 260px;
    }
    #banner {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      min-width: 360px;
      max-width: min(90vw, 720px);
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.62);
      border: 1px solid rgba(255,255,255,0.18);
      text-align: center;
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    #banner.visible {
      opacity: 1;
    }
    #fatal-error {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      min-width: 380px;
      max-width: min(90vw, 900px);
      padding: 12px 14px;
      background: rgba(40, 6, 12, 0.92);
      border: 1px solid rgba(255, 130, 140, 0.55);
      color: #ffd9de;
      font-size: 0.83rem;
      line-height: 1.45;
      white-space: pre-wrap;
      display: none;
      pointer-events: none;
    }
    #fatal-error.visible {
      display: block;
    }
    h1, h2, p {
      margin: 0;
    }
    #level-name {
      font-size: 1.2rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #level-subtitle {
      margin-top: 6px;
      color: rgba(255,255,255,0.72);
      font-size: 0.88rem;
      line-height: 1.45;
    }
    #controls-help, #stats-panel, #shot-buttons {
      margin-top: 14px;
      font-size: 0.84rem;
      line-height: 1.55;
      color: rgba(255,255,255,0.88);
    }
    #shot-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.06);
      color: inherit;
      padding: 8px 12px;
      cursor: pointer;
      pointer-events: auto;
      font: inherit;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 140ms ease, border-color 140ms ease;
    }
    button:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.38);
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .stats-row span:last-child {
      color: rgba(255,255,255,0.72);
    }
    .muted {
      color: rgba(255,255,255,0.62);
    }
    .accent {
      color: #ffd985;
    }
    .hidden {
      display: none !important;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="overlay">
    <div id="left-panel" class="panel">
      <h1 id="level-name">Loading</h1>
      <p id="level-subtitle">Preparing standalone biome review harness.</p>
      <div id="controls-help">
        <div><span class="accent">Click</span> Pointer lock</div>
        <div><span class="accent">WASD</span> Move</div>
        <div><span class="accent">Q / E</span> Down / Up</div>
        <div><span class="accent">Shift</span> Boost</div>
        <div><span class="accent">R</span> Reset shot</div>
        <div><span class="accent">Hero / Gameplay</span> Saved shots</div>
        <div><span class="accent">1-4</span> Jump to biome</div>
        <div><span class="accent">N / P</span> Next / Previous</div>
        <div><span class="accent">C</span> Clearance overlay</div>
        <div><span class="accent">F</span> Toggle stats</div>
      </div>
      <div id="shot-buttons">
        <button id="prev-level" type="button">Prev</button>
        <button id="next-level" type="button">Next</button>
        <button id="hero-shot" type="button">Hero</button>
        <button id="gameplay-shot" type="button">Gameplay</button>
        <button id="reset-shot" type="button">Reset</button>
      </div>
    </div>
    <div id="right-panel" class="panel">
      <h2>Stats</h2>
      <div id="stats-panel"></div>
    </div>
  </div>
  <div id="banner"></div>
  <div id="fatal-error"></div>
  <script>
    (function () {
      const errorPanel = document.getElementById('fatal-error');
      function showError(prefix, value) {
        const message = value instanceof Error
          ? `${value.name}: ${value.message}\n${value.stack || ''}`
          : String(value);
        errorPanel.textContent = `${prefix}\n${message}`;
        errorPanel.classList.add('visible');
      }
      window.addEventListener('error', (event) => {
        showError('window.error', event.error || event.message || 'Unknown error');
      });
      window.addEventListener('unhandledrejection', (event) => {
        showError('unhandledrejection', event.reason || 'Unknown rejection');
      });
      import('./shared/levelRuntime.js').catch((error) => {
        showError('module import failed', error);
      });
    }());
  </script>
</body>
</html>
